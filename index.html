<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Lock to portrait: Screen Orientation API -->
    <style>
      #landscape-block {
        display: none;
        position: fixed; inset: 0; z-index: 99999;
        background: #07071a;
        flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; color: white; font-family: 'Segoe UI', system-ui, sans-serif;
      }
      @media screen and (orientation: landscape) and (max-height: 500px) {
        #landscape-block { display: flex !important; }
        #root { display: none !important; }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Starry Night MPlayer — Pemutar musik AI dengan tema luar angkasa" />
    <meta name="theme-color" content="#07071a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StarryMPlayer" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Apple PWA Splash Screens -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Inline splash while app loads — matches starry night web design */
      #splash {
        position:fixed;inset:0;z-index:9999;
        background:#07071a;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:16px;transition:opacity 0.4s ease;
      }
      #splash.hide{opacity:0;pointer-events:none;}
    </style>
    <!-- Resource hints untuk load lebih cepat -->
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin/>
    <link rel="preconnect" href="https://i.scdn.co" crossorigin/>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin/>
    <link rel="dns-prefetch" href="https://accounts.google.com"/>
    <link rel="dns-prefetch" href="https://api.lyrics.ovh"/>
    <title>Starry Night MPlayer</title>
  </head>
  <body style="background:#07071a;margin:0;padding:0;overflow:hidden;">
    <!-- PWA Splash Screen (matches starry web design) -->
    <div id="splash">
      <svg width="72" height="72" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="slg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#c084fc"/>
          </linearGradient>
          <filter id="sglow">
            <feGaussianBlur stdDeviation="0.8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx="16" cy="16" r="15.5" fill="#07071e"/>
        <circle cx="16" cy="16" r="15.5" stroke="url(#slg)" stroke-width="1" fill="none" opacity="0.5"/>
        <circle cx="16" cy="16" r="10.5" stroke="url(#slg)" stroke-width="2.2" fill="none"
          stroke-dasharray="46 20" stroke-linecap="round" transform="rotate(-60 16 16)"/>
        <circle cx="23.4" cy="9.4" r="2.2" fill="white" filter="url(#sglow)"/>
        <path d="M16 9.5 L17.1 14.9 L22.5 16 L17.1 17.1 L16 22.5 L14.9 17.1 L9.5 16 L14.9 14.9 Z"
          fill="white" opacity="0.95" filter="url(#sglow)"/>
        <circle cx="7.5" cy="8.5" r="0.9" fill="white" opacity="0.55"/>
        <circle cx="24.5" cy="24" r="0.7" fill="white" opacity="0.45"/>
        <circle cx="9" cy="23.5" r="0.6" fill="#60a5fa" opacity="0.7"/>
      </svg>
      <div style="font-family:'Segoe UI',system-ui,sans-serif;color:white;font-size:18px;font-weight:800;letter-spacing:0.02em;">Starry Night</div>
      <div style="font-family:'Segoe UI',system-ui,sans-serif;color:rgba(255,255,255,0.35);font-size:12px;font-weight:500;">MPlayer</div>
      <div style="width:32px;height:2px;background:linear-gradient(90deg,#60a5fa,#c084fc);border-radius:999px;margin-top:8px;
                  animation:spl 1.5s ease-in-out infinite;">
      </div>
      <style>@keyframes spl{0%,100%{opacity:0.3;transform:scaleX(0.5)}50%{opacity:1;transform:scaleX(1)}}</style>
    </div>
    <!-- Portrait-only overlay -->
    <div id="landscape-block">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect x="8" y="4" width="32" height="40" rx="5" stroke="white" stroke-width="2.5" stroke-opacity="0.4"/>
        <path d="M24 36 L20 32 M24 36 L28 32" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M24 12 L24 36" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div style="font-size:15px;font-weight:700;opacity:0.85;">Putar layar ke portrait</div>
      <div style="font-size:12px;opacity:0.4;">Starry Night MPlayer hanya mendukung mode portrait</div>
    </div>
    <div id="root"></div>
    <script>
      // Screen Orientation API lock (PWA & modern browsers)
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(function(){});
      }

      // Hide splash once React mounts
      function hideSplash() {
        var s = document.getElementById('splash');
        if (s && !s._hidden) {
          s._hidden = true;
          s.classList.add('hide');
          setTimeout(function(){ if (s.parentNode) s.remove(); }, 450);
        }
      }
      window.addEventListener('DOMContentLoaded', function() {
        var root = document.getElementById('root');

        // Primary: observe React mount
        var obs = new MutationObserver(function() {
          if (root && root.children.length > 0) {
            setTimeout(hideSplash, 300);
            obs.disconnect();
          }
        });
        obs.observe(root, { childList: true });

        // Fallback 1: jika React sudah mount tapi observer kelewatan
        setTimeout(function() {
          if (root && root.children.length > 0) { obs.disconnect(); hideSplash(); }
        }, 1500);

        // Fallback 2: paksa hilang setelah 5 detik apapun yang terjadi
        setTimeout(function() { obs.disconnect(); hideSplash(); }, 5000);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
