<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://cdn.jsdelivr.net; script-src-elem 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://accounts.google.com; style-src-elem 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https: blob:; media-src 'self' https: http: blob:; connect-src 'self' https: http:; font-src 'self' data:; worker-src 'self' blob:; frame-src https://open.spotify.com https://www.youtube.com https://www.deezer.com https://w.soundcloud.com https://bandcamp.com; form-action 'self' https:;" />

    <!-- ── Viewport & Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── PWA: Web App Manifest ── -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── PWA: Android / Chrome ── -->
    <meta name="theme-color" content="#07071a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Starry Night MPlayer — Pemutar musik AI dengan tema luar angkasa" />

    <!-- ── PWA: iOS Safari (WAJIB untuk standalone di iPhone/iPad) ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StarryMPlayer" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- ── iOS Splash Screens (agar tidak dibuka di browser saat launch) ── -->
    <!-- Portrait splash — ukuran umum iPhone -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icon-512.png" />
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icon-512.png" />
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/icon-512.png" />
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icon-512.png" />
    <!-- Generic fallback splash -->
    <link rel="apple-touch-startup-image" href="/icon-512.png" />

    <style>
      /* Inline splash while app loads — matches starry night web design */
      #splash {
        position:fixed;inset:0;z-index:9999;
        background:#07071a;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:16px;transition:opacity 0.4s ease;
      }
      #splash.hide{opacity:0;pointer-events:none;}
    </style>

    <!-- Resource hints -->
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin/>
    <link rel="preconnect" href="https://i.scdn.co" crossorigin/>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin/>
    <link rel="dns-prefetch" href="https://accounts.google.com"/>
    <link rel="dns-prefetch" href="https://api.lyrics.ovh"/>

    <title>Starry Night MPlayer</title>
  </head>
  <body style="background:#07071a;margin:0;padding:0;overflow:hidden;">
    <!-- PWA Splash Screen -->
    <div id="splash">
      <svg width="72" height="72" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="slg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#c084fc"/>
          </linearGradient>
          <filter id="sglow">
            <feGaussianBlur stdDeviation="0.8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx="16" cy="16" r="15.5" fill="#07071e"/>
        <circle cx="16" cy="16" r="15.5" stroke="url(#slg)" stroke-width="1" fill="none" opacity="0.5"/>
        <circle cx="16" cy="16" r="10.5" stroke="url(#slg)" stroke-width="2.2" fill="none"
          stroke-dasharray="46 20" stroke-linecap="round" transform="rotate(-60 16 16)"/>
        <circle cx="23.4" cy="9.4" r="2.2" fill="white" filter="url(#sglow)"/>
        <path d="M16 9.5 L17.1 14.9 L22.5 16 L17.1 17.1 L16 22.5 L14.9 17.1 L9.5 16 L14.9 14.9 Z"
          fill="white" opacity="0.95" filter="url(#sglow)"/>
        <circle cx="7.5" cy="8.5" r="0.9" fill="white" opacity="0.55"/>
        <circle cx="24.5" cy="24" r="0.7" fill="white" opacity="0.45"/>
        <circle cx="9" cy="23.5" r="0.6" fill="#60a5fa" opacity="0.7"/>
      </svg>
      <div style="font-family:'Segoe UI',system-ui,sans-serif;color:white;font-size:18px;font-weight:800;letter-spacing:0.02em;">Starry Night</div>
      <div style="font-family:'Segoe UI',system-ui,sans-serif;color:rgba(255,255,255,0.35);font-size:12px;font-weight:500;">MPlayer</div>
      <div style="width:32px;height:2px;background:linear-gradient(90deg,#60a5fa,#c084fc);border-radius:999px;margin-top:8px;
                  animation:spl 1.5s ease-in-out infinite;">
      </div>
      <style>@keyframes spl{0%,100%{opacity:0.3;transform:scaleX(0.5)}50%{opacity:1;transform:scaleX(1)}}</style>
    </div>

    <div id="root"></div>
    <!-- ── Window Controls Overlay title bar ── -->
    <!-- Visible only when the PWA runs with display_override: window-controls-overlay -->
    <div id="wco-titlebar" aria-hidden="true">
      <!-- Star icon (same SVG used in the splash) -->
      <svg class="wco-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="wco-lg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#c084fc"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="10.5" stroke="url(#wco-lg)" stroke-width="2.2" fill="none"
          stroke-dasharray="46 20" stroke-linecap="round" transform="rotate(-60 16 16)"/>
        <path d="M16 9.5 L17.1 14.9 L22.5 16 L17.1 17.1 L16 22.5 L14.9 17.1 L9.5 16 L14.9 14.9 Z"
          fill="url(#wco-lg)" opacity="0.95"/>
      </svg>
      <span class="wco-label">Starry Night MPlayer</span>
    </div>
    <script>
      // Hide splash once React mounts
      function hideSplash() {
        var s = document.getElementById('splash');
        if (s && !s._hidden) {
          s._hidden = true;
          s.classList.add('hide');
          setTimeout(function(){ if (s.parentNode) s.remove(); }, 450);
        }
      }
      window.addEventListener('DOMContentLoaded', function() {
        var root = document.getElementById('root');
        var obs = new MutationObserver(function() {
          if (root && root.children.length > 0) {
            setTimeout(hideSplash, 300);
            obs.disconnect();
          }
        });
        obs.observe(root, { childList: true });
        setTimeout(function() {
          if (root && root.children.length > 0) { obs.disconnect(); hideSplash(); }
        }, 1500);
        setTimeout(function() { obs.disconnect(); hideSplash(); }, 5000);
      });

      // ── Service Worker: Auto-Unregister & Bypass Cache ────────────────────────
      //
      // STRATEGI:
      // 1. BYPASS CACHE  — SW di-fetch dengan `updateViaCache: 'none'` sehingga
      //    browser SELALU mengambil sw.js langsung dari jaringan (bukan cache HTTP),
      //    persis seperti `Cache-Control: no-store` pada file sw.js itu sendiri.
      //    Ini mencegah browser "terjebak" memakai sw.js versi lama yang sudah
      //    kadaluarsa hanya karena HTTP cache belum expired.
      //
      // 2. AUTO-UNREGISTER — Jika SW yang aktif terdeteksi "bug" (versi tidak cocok,
      //    gagal aktivasi, atau error fatal), semua registrasi SW di-unregister,
      //    seluruh cache Workbox dihapus, lalu halaman di-reload otomatis sekali.
      //    Flag `sw_reset` di sessionStorage mencegah reload loop tak terbatas.
      //
      // VitePWA (`injectRegister: 'auto'`) tetap menangani registrasi di build mode.
      // Kode di bawah HANYA mengatur kebijakan update & mekanisme pemulihan darurat.
      // ────────────────────────────────────────────────────────────────────────────
      (function () {
        if (!('serviceWorker' in navigator)) return;

        // ── Konstanta ──
        var SW_URL        = '/sw.js';
        var RESET_KEY     = 'sw_reset';          // sessionStorage key anti-loop
        var BUILD_VERSION = '__SW_BUILD_VERSION__'; // diganti saat build via Vite define

        // ── Helpers ──
        function log(msg)  { console.info('[SW-Manager]', msg); }
        function warn(msg) { console.warn('[SW-Manager]', msg); }

        /** Hapus semua cache Workbox lalu reload halaman (sekali). */
        function nukeAndReload(reason) {
          if (sessionStorage.getItem(RESET_KEY) === '1') {
            warn('Reset sudah dilakukan sebelumnya — hentikan untuk cegah loop. Alasan: ' + reason);
            return;
          }
          sessionStorage.setItem(RESET_KEY, '1');
          sessionStorage.removeItem('sw_cc_reloaded');
          warn('Auto-unregister dipicu: ' + reason);

          // Unregister semua SW
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var unregPromises = regs.map(function (r) {
              return r.unregister().then(function (ok) {
                log('Unregistered SW scope=' + r.scope + ' ok=' + ok);
              });
            });
            return Promise.all(unregPromises);
          }).then(function () {
            // Hapus semua cache (Workbox dan lainnya)
            if ('caches' in window) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) {
                  log('Hapus cache: ' + k);
                  return caches.delete(k);
                }));
              });
            }
          }).then(function () {
            log('Semua cache dihapus. Reload…');
            window.location.reload();
          }).catch(function (err) {
            warn('Gagal saat nukeAndReload: ' + err);
            window.location.reload();
          });
        }

        /** Periksa apakah SW yang aktif perlu di-reset. */
        function inspectRegistration(reg) {
          var sw = reg.active || reg.installing || reg.waiting;
          if (!sw) return;

          // Tanda #1 — SW dalam state "redundant" (gagal aktivasi)
          sw.addEventListener('statechange', function () {
            if (sw.state === 'redundant') {
              nukeAndReload('SW masuk state redundant (gagal aktivasi)');
            }
          });
          if (sw.state === 'redundant') {
            nukeAndReload('SW sudah redundant saat inspeksi awal');
            return;
          }

          // Tanda #2 — Versi build tidak cocok (stale SW dari deploy lama)
          //   SW dapat membalas pesan {type:'SW_VERSION', version:'xxx'}.
          //   Jika versi tidak sama dengan BUILD_VERSION, reset.
          if (BUILD_VERSION && BUILD_VERSION !== '__SW_BUILD_VERSION__') {
            var mc = new MessageChannel();
            mc.port1.onmessage = function (evt) {
              if (evt.data && evt.data.type === 'SW_VERSION') {
                var swVer = evt.data.version;
                if (swVer && swVer !== BUILD_VERSION) {
                  nukeAndReload('Versi SW (' + swVer + ') ≠ build (' + BUILD_VERSION + ')');
                } else {
                  log('Versi SW cocok: ' + swVer);
                }
              }
            };
            sw.postMessage({ type: 'GET_VERSION' }, [mc.port2]);
          }
        }

        // ── Main: daftar / periksa SW dengan updateViaCache: 'none' ──
        navigator.serviceWorker.register(SW_URL, {
          // BYPASS CACHE: browser selalu fetch sw.js dari jaringan,
          // mengabaikan HTTP cache (setara header Cache-Control: no-store).
          updateViaCache: 'none',
          scope: '/',
        }).then(function (reg) {
          log('SW terdaftar. Scope=' + reg.scope);
          inspectRegistration(reg);

          // Paksa cek update segera (tanpa menunggu 24 jam bawaan browser)
          reg.update().catch(function (e) { warn('reg.update() gagal: ' + e); });

          // Deteksi SW baru yang sudah menunggu — paksa skipWaiting jika beda versi
          reg.addEventListener('updatefound', function () {
            var newSW = reg.installing;
            if (!newSW) return;
            log('SW baru ditemukan, sedang menginstal…');
            newSW.addEventListener('statechange', function () {
              log('SW baru state: ' + newSW.state);
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                // SW baru siap tapi halaman masih pakai SW lama.
                // VitePWA sudah set skipWaiting:true di workbox config,
                // jadi ini harusnya otomatis. Ini sebagai failsafe.
                log('SW baru installed & waiting — skipWaiting fallback.');
                newSW.postMessage({ type: 'SKIP_WAITING' });
              }
              if (newSW.state === 'redundant') {
                nukeAndReload('SW baru gagal aktivasi (redundant setelah install)');
              }
            });
          });
        }).catch(function (err) {
          // Registrasi awal gagal — kemungkinan besar karena SW lama corrupt/bug.
          warn('Registrasi SW gagal: ' + err + '. Coba auto-unregister…');
          nukeAndReload('Registrasi awal gagal: ' + err);
        });

        // ── Reload otomatis saat SW baru mengambil alih kontrol ──
        // (controllerchange terjadi setelah skipWaiting + clientsClaim)
        // CC_RELOAD_KEY dipakai terpisah dari RESET_KEY dan disimpan di
        // sessionStorage. Variabel JS `refreshing` saja TIDAK cukup karena
        // direset setiap kali skrip dieksekusi ulang setelah reload — pada
        // first-load setelah cache/cookie/site-data dibersihkan, SW baru selalu
        // install->activate->controllerchange di SETIAP reload (tidak ada yang
        // sudah ter-cache), sehingga tanpa flag persist ini terjadi reload loop
        // tak berhenti dan halaman tidak pernah terbuka.
        var CC_RELOAD_KEY = 'sw_cc_reloaded';
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          log('SW controller berubah.');
          try {
            if (sessionStorage.getItem(CC_RELOAD_KEY) === '1') {
              log('Sudah pernah reload karena controllerchange — skip reload kali ini.');
              return;
            }
            sessionStorage.setItem(CC_RELOAD_KEY, '1');
          } catch (e) {}
          log('Reload untuk pakai SW terbaru.');
          window.location.reload();
        });

        // ── Error handler global — tangkap error fetch yang BENAR-BENAR dari SW ──
        // Diperketat: hanya bereaksi pada error yang eksplisit menyebut service
        // worker / sw.js / workbox, BUKAN error fetch generik (gambar, audio,
        // API, dll). Versi sebelumnya memicu nukeAndReload untuk SEMUA
        // "Failed to fetch", yang sering terjadi tepat setelah cache dibersihkan
        // (banyak resource gagal di percobaan pertama) → menyebabkan reset+reload
        // loop dan halaman tak pernah benar-benar terbuka.
        window.addEventListener('error', function (evt) {
          var msg = evt.message || '';
          if (/service.?worker|sw\.js|workbox/i.test(msg) && /Failed to fetch|NetworkError/i.test(msg)) {
            nukeAndReload('Error fetch SW spesifik: ' + msg);
          }
        });

      }());

      // ── Detect standalone mode — sembunyikan elemen browser jika berjalan sebagai PWA ──
      (function() {
        var isStandalone =
          window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches;
        if (isStandalone) {
          document.documentElement.classList.add('pwa-standalone');
        }
      })();

      // ── Window Controls Overlay — update CSS custom properties on geometry change ──
      (function() {
        if (!('windowControlsOverlay' in navigator)) return;
        function updateWCOGeometry() {
          var geo = navigator.windowControlsOverlay.getTitlebarAreaRect();
          var root = document.documentElement;
          root.style.setProperty('--wco-top',    geo.y      + 'px');
          root.style.setProperty('--wco-left',   geo.x      + 'px');
          root.style.setProperty('--wco-width',  geo.width  + 'px');
          root.style.setProperty('--wco-height', geo.height + 'px');
        }
        navigator.windowControlsOverlay.addEventListener('geometrychange', updateWCOGeometry);
        updateWCOGeometry();
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
