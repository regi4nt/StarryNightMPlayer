    </filter>
  </defs>
  <circle cx="16" cy="16" r="15.5" fill="#07071e"/>
  <circle cx="16" cy="16" r="15.5" stroke="url(#lg1)" stroke-width="1" fill="none" opacity="0.5"/>
  <circle cx="16" cy="16" r="10.5" stroke="url(#lg2)" stroke-width="2.2" fill="none"
