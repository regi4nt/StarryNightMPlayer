<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="110" fill="#07071a"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Stars -->
  <circle cx="100" cy="80" r="4" fill="white" opacity="0.6"/>
  <circle cx="420" cy="60" r="3" fill="white" opacity="0.5"/>
  <circle cx="380" cy="140" r="2" fill="white" opacity="0.4"/>
  <circle cx="60" cy="200" r="3" fill="white" opacity="0.5"/>
  <circle cx="450" cy="380" r="4" fill="white" opacity="0.6"/>
  <circle cx="80" cy="420" r="2" fill="white" opacity="0.4"/>
  <!-- Orbital ring -->
  <circle cx="256" cy="256" r="170" stroke="url(#g1)" stroke-width="8" fill="none" opacity="0.35"/>
  <circle cx="256" cy="256" r="170" stroke="url(#g1)" stroke-width="3" fill="none" opacity="0.6" stroke-dasharray="40 20"/>
  <!-- Dot on ring -->
  <circle cx="256" cy="86" r="14" fill="url(#g1)"/>
  <!-- Center note icon -->
  <circle cx="256" cy="256" r="100" fill="url(#g1)" opacity="0.15"/>
  <text x="256" y="290" font-size="110" text-anchor="middle" fill="url(#g1)" font-family="Arial">♫</text>
</svg>
